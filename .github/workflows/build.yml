name: Build FFmpeg with WMV3 (WMV9) support

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf \
          automake \
          build-essential \
          cmake \
          git \
          libtool \
          pkg-config \
          texinfo \
          zlib1g-dev \
          libvpx-dev \
          libfdk-aac-dev \
          libx264-dev \
          libx265-dev \
          nasm \
          yasm # Добавлено для сборки FFmpeg

    - name: Check for required libraries
      run: |
        sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev
        echo "Checking for required libraries..."
        
        # Устанавливаем переменную окружения для поиска библиотек
        export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH

        # Проверяем наличие библиотек
        if ! ldconfig -p | grep -q 'libavcodec.so'; then
          echo "libavcodec.so is missing!"
          exit 1
        fi
        if ! ldconfig -p | grep -q 'libavformat.so'; then
          echo "libavformat.so is missing!"
          exit 1
        fi
        if ! ldconfig -p | grep -q 'libavutil.so'; then
          echo "libavutil.so is missing!"
          exit 1
        fi
        echo "All required libraries are present."

    - name: Clone FFmpeg
      run: |
        git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg
        cd ffmpeg
        git checkout release/4.4  # Выбираем стабильную ветку, можешь выбрать другую

    - name: Configure FFmpeg with WMV3 support
      run: |
        cd ffmpeg
        ./configure --enable-encoder=wmv3 --enable-static --disable-shared

    - name: Build FFmpeg
      run: |
        cd ffmpeg
        make -j$(nproc)
        sudo make install

    - name: Verify FFmpeg build
      run: |
        ffmpeg -codecs | grep wmv3

    - name: Create build artifacts
      run: |
        cd ffmpeg
        mkdir -p build_artifacts
        cp /usr/local/bin/ffmpeg build_artifacts/
        cp /usr/lib/x86_64-linux-gnu/libavcodec.so build_artifacts/
        cp /usr/lib/x86_64-linux-gnu/libavformat.so build_artifacts/
        cp /usr/lib/x86_64-linux-gnu/libavutil.so build_artifacts/
        # Создаем временную директорию для архивации
        mkdir -p /tmp/ffmpeg_artifacts
        mv build_artifacts/* /tmp/ffmpeg_artifacts/
        # Архивируем файлы в /tmp
        tar -czf /tmp/ffmpeg-build.tar.gz -C /tmp ffmpeg_artifacts
        # Перемещаем архив в нужную директорию
        mv /tmp/ffmpeg-build.tar.gz build_artifacts/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-build
        path: ffmpeg/build_artifacts/ffmpeg-build.tar.gz