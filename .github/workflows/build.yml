name: Build FFmpeg 32-bit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозиторий
        uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          sudo apt update
          sudo apt install -y mingw-w64 nasm yasm pkg-config

      - name: Клонирование FFmpeg
        run: git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg

      - name: Сборка FFmpeg 32-bit
        run: |
          cd ffmpeg
          ./configure --arch=x86 --target-os=mingw32 --cross-prefix=i686-w64-mingw32- \
            --enable-gpl --enable-version3 --disable-programs \
            --enable-encoder=wmv3 --enable-decoder=wmv3 \
            --enable-muxer=asf --enable-demuxer=asf \
            --enable-static --disable-shared --disable-doc
          make -j$(nproc)

      - name: Архивация
        run: |
          cd ffmpeg
          tar -czf ffmpeg-32bit.tar.gz ffmpeg

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-32bit
          path: ffmpeg/ffmpeg-32bit.tar.gz