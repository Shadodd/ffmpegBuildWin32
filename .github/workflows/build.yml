name: Build FFmpeg for 32-bit Windows on Linux

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf \
          automake \
          build-essential \
          cmake \
          git \
          libtool \
          pkg-config \
          texinfo \
          zlib1g-dev \
          libvpx-dev \
          libfdk-aac-dev \
          libx264-dev \
          libx265-dev \
          nasm \
          yasm \
          mingw-w64-i686-toolchain # Устанавливаем MinGW для 32-битных Windows

    - name: Clone FFmpeg
      run: |
        git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg
        cd ffmpeg
        git checkout release/4.4  # Выбираем стабильную ветку

    - name: Configure FFmpeg with WMV3 support for 32-bit Windows
      run: |
        cd ffmpeg
        ./configure --prefix=/usr/local --target-os=mingw32 --arch=i386 --enable-encoder=wmv3 --enable-static --disable-shared --cross-prefix=i686-w64-mingw32-

    - name: Build FFmpeg for 32-bit Windows
      run: |
        cd ffmpeg
        make -j$(nproc)
        make install

    - name: Verify FFmpeg build
      run: |
        i686-w64-mingw32-ffmpeg -codecs | grep wmv3

    - name: Create build artifacts
      run: |
        cd ffmpeg
        mkdir -p build_artifacts
        cp /usr/local/bin/i686-w64-mingw32-ffmpeg build_artifacts/
        cp /usr/local/lib/i686-w64-mingw32/libavcodec.a build_artifacts/
        cp /usr/local/lib/i686-w64-mingw32/libavformat.a build_artifacts/
        cp /usr/local/lib/i686-w64-mingw32/libavutil.a build_artifacts/
        tar -czf build_artifacts/ffmpeg-build.tar.gz -C build_artifacts .

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-build
        path: ffmpeg/build_artifacts/ffmpeg-build.tar.gz