name: Build FFmpeg with WMV3 (WMV9) support

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf \
          automake \
          build-essential \
          cmake \
          git \
          libtool \
          pkg-config \
          texinfo \
          zlib1g-dev \
          libvpx-dev \
          libfdk-aac-dev \
          libx264-dev \
          libx265-dev

    - name: Clone FFmpeg
      run: |
        git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg
        cd ffmpeg
        git checkout release/4.4  # Выбираем стабильную ветку, можно выбрать другую

    - name: Configure FFmpeg with WMV3 support
      run: |
        cd ffmpeg
        ./configure --enable-encoder=wmv3 --enable-static --disable-shared

    - name: Build FFmpeg
      run: |
        cd ffmpeg
        make -j$(nproc)
        sudo make install

    - name: Verify FFmpeg build
      run: |
        ffmpeg -codecs | grep wmv3