name: Build FFmpeg 32-bit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          sudo apt update
          sudo apt install -y mingw-w64 nasm yasm pkg-config make automake autoconf git \
                             libvpx-dev libx264-dev libx265-dev libfdk-aac-dev libmp3lame-dev \
                             libopus-dev libvorbis-dev libass-dev

      - name: Клонирование FFmpeg
        run: |
          git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg
          cd ffmpeg
          git checkout release/6.1  # Используем стабильную версию

      - name: Конфигурация сборки
        run: |
          cd ffmpeg
          ./configure --arch=x86 --target-os=mingw32 --cross-prefix=i686-w64-mingw32- \
            --enable-gpl --enable-version3 --enable-static --disable-shared --disable-doc \
            --enable-encoder=wmv3 --enable-decoder=wmv3 --enable-muxer=asf --enable-demuxer=asf \
            --enable-encoder=wmv2 --enable-decoder=wmv2 --enable-muxer=wmv \
            --enable-libx264 --enable-libx265 --enable-libmp3lame --enable-libopus --enable-libvorbis \
            --enable-libvpx --enable-libass

      - name: Компиляция FFmpeg
        run: |
          cd ffmpeg
          make -j$(nproc)

      - name: Архивация результата
        run: |
          cd ffmpeg
          tar -czf ffmpeg-32bit.tar.gz ffmpeg.exe

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-32bit
          path: ffmpeg/ffmpeg-32bit.tar.gz